# Package core para componente tclac (aires TCL/Hyundai/Daichi/Ballu/etc)
#
# Substituciones requeridas en el YAML del dispositivo:
#   device_name          -> ID del dispositivo (snake_case)
#   humanly_name         -> Nombre legible
#   wifi_ssid            -> SSID WiFi
#   wifi_password        -> Password WiFi
#   recovery_pass        -> Password del AP de fallback
#   ota_pass             -> Password OTA
#   api_key              -> Clave API de ESPHome
#   uart_rx, uart_tx     -> Pines GPIO de UART hacia el aire

external_components:
  - source:
      type: git
      url: https://github.com/atiscornia/tclac.git
      ref: master
    components: [tclac]
    refresh: 0s

esphome:
  name: ${device_name}
  friendly_name: ${humanly_name}

logger:
  level: DEBUG

api:
  encryption:
    key: ${api_key}

ota:
  - platform: esphome
    password: ${ota_pass}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "${humanly_name} Fallback"
    password: ${recovery_pass}

captive_portal:

uart:
  id: tclac_uart
  baud_rate: 9600
  parity: EVEN
  rx_pin: ${uart_rx}
  tx_pin: ${uart_tx}

climate:
  - platform: tclac
    name: ${humanly_name} Climate
    id: ${device_name}climate
    uart_id: tclac_uart
    supported_modes:
      - "OFF"
      - HEAT_COOL
      - COOL
      - HEAT
      - DRY
      - FAN_ONLY
    supported_presets: []
    supported_fan_modes:
      - AUTO
      - QUIET
      - LOW
      - MIDDLE
      - MEDIUM
      - HIGH
      - FOCUS
      - DIFFUSE
    supported_swing_modes:
      - "OFF"
      - VERTICAL
    visual:
      min_temperature: 16
      max_temperature: 31
      temperature_step:
        target_temperature: 1
        current_temperature: 1

select:
  - platform: template
    name: "Barrido vertical"
    id: ${device_name}_vertical_swing
    icon: mdi:swap-vertical
    optimistic: true
    restore_value: true
    options:
      - "De arriba a abajo"
      - "Mitad superior"
      - "Mitad inferior"
    initial_option: "De arriba a abajo"
    set_action:
      - lambda: |-
          if (x == "De arriba a abajo") {
            id(${device_name}climate).set_vertical_swing_direction(esphome::tclac::VerticalSwingDirection::UP_DOWN);
          } else if (x == "Mitad superior") {
            id(${device_name}climate).set_vertical_swing_direction(esphome::tclac::VerticalSwingDirection::UPSIDE);
          } else if (x == "Mitad inferior") {
            id(${device_name}climate).set_vertical_swing_direction(esphome::tclac::VerticalSwingDirection::DOWNSIDE);
          }

  - platform: template
    name: "Posicion flap vertical"
    id: ${device_name}_vertical_airflow
    icon: mdi:arrow-expand-vertical
    optimistic: true
    restore_value: true
    options:
      - "Ultima posicion"
      - "Arriba del todo"
      - "Mitad superior"
      - "Centro"
      - "Mitad inferior"
      - "Abajo del todo"
    initial_option: "Centro"
    set_action:
      - lambda: |-
          if (x == "Ultima posicion") {
            id(${device_name}climate).set_vertical_airflow(esphome::tclac::AirflowVerticalDirection::LAST);
          } else if (x == "Arriba del todo") {
            id(${device_name}climate).set_vertical_airflow(esphome::tclac::AirflowVerticalDirection::MAX_UP);
          } else if (x == "Mitad superior") {
            id(${device_name}climate).set_vertical_airflow(esphome::tclac::AirflowVerticalDirection::UP);
          } else if (x == "Centro") {
            id(${device_name}climate).set_vertical_airflow(esphome::tclac::AirflowVerticalDirection::CENTER);
          } else if (x == "Mitad inferior") {
            id(${device_name}climate).set_vertical_airflow(esphome::tclac::AirflowVerticalDirection::DOWN);
          } else if (x == "Abajo del todo") {
            id(${device_name}climate).set_vertical_airflow(esphome::tclac::AirflowVerticalDirection::MAX_DOWN);
          }
